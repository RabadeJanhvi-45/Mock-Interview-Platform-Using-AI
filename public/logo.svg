<svg xmlns="http://www.w3.org/2000/svg" width="160" height="46" viewBox="0 0 160 46">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Dark Header Background -->
  <rect width="160" height="46" fill="#0B132B" rx="6" />
  
  <!-- Integrated AI Brain + Speech Bubble Symbol -->
  <g transform="translate(12, 11)" fill="none" stroke="url(#aiGrad)" stroke-width="1.5">
    <!-- Speech Bubble Outline -->
    <path d="M20 2C10.1 2 2 8.3 2 16c0 3.3 1.5 6.3 4 8.7L4 30l6.3-2.3C13.1 28.6 16.5 29 20 29c9.9 0 18-6.3 18-14S30 2 20 2z" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Neural Network Nodes (Simple Representation) -->
    <circle cx="15" cy="11" r="1" fill="#06b6d4" stroke="none" />
    <circle cx="20" cy="11" r="1" fill="#3b82f6" stroke="none" />
    <circle cx="25" cy="11" r="1" fill="#06b6d4" stroke="none" />
    <circle cx="20" cy="17" r="1" fill="#3b82f6" stroke="none" />
    <path d="M15 11 L20 11 M20 11 L25 11 M15 11 L20 17 M25 11 L20 17 M20 11 L20 17" stroke="#3b82f6" stroke-width="0.75" stroke-linecap="round" />
  </g>

  <!-- Logo Text (Shifted right for the symbol) -->
  <text x="96" y="28" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    <tspan fill="url(#aiGrad)">AI MOCK </tspan>
    <tspan fill="#FFFFFF">INTERVIEW</tspan>
  </text>
  
  <!-- Accent Border Line -->
  <rect x="0" y="43" width="160" height="3" fill="url(#aiGrad)" rx="1.5" />
</svg>